services:
  autoledger:
    build:
      context: .
    image: autoledger:local
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set TRUSTED_HOSTS}
    ports:
      - "${APP_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
